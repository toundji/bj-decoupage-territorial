# Publie la page d'exploration (public/ + data/decoupage.json) sur GitHub Pages.
# Sans API, la page lit l'instantané JSON généré par `npm run export:json`.
name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/build-site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Contenu indexable, données structurées et sitemap, depuis data/decoupage.json
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
