<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Découpage territorial du Bénin</title>
<style>
  :root {
    --bg: #f6f7f5;
    --surface: #ffffff;
    --surface-2: #eef1ed;
    --text: #1b1f1c;
    --muted: #5d665f;
    --border: #dde2dc;
    --accent: #00794a;
    --accent-strong: #00603b;
    --accent-soft: #e2f2ea;
    --on-accent: #ffffff;
    --yellow: #f2c400;
    --red: #d81b33;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121513;
      --surface: #1a1e1b;
      --surface-2: #232825;
      --text: #e7ebe8;
      --muted: #9aa49d;
      --border: #2f3531;
      --accent: #3fbf86;
      --accent-strong: #5fd39f;
      --accent-soft: #1d3329;
      --on-accent: #0b1f15;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .flag { display: flex; height: 4px; }
  .flag span:nth-child(1) { flex: 2; background: var(--accent); }
  .flag span:nth-child(2) { flex: 3; background: var(--yellow); }
  .flag span:nth-child(3) { flex: 3; background: var(--red); }
  header, main { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 24px; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .top a { color: var(--accent); font-size: 14px; text-decoration: none; }
  .top a:hover { text-decoration: underline; }
  .sub { color: var(--muted); margin: 4px 0 18px; font-size: 14px; }
  .source { display: inline-block; margin-left: 4px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); font-size: 12px; }
  .source:empty { display: none; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }

  .search { position: relative; margin-bottom: 14px; }
  .search input {
    width: 100%; padding: 11px 14px; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .results {
    position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 420px; overflow: auto; display: none;
  }
  .results.open { display: block; }
  .results h4 { margin: 0; padding: 8px 14px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .results button { display: block; width: 100%; text-align: left; padding: 7px 14px; border: 0; background: none; font: inherit; color: var(--text); cursor: pointer; }
  .results button:hover, .results button:focus { background: var(--surface-2); outline: none; }
  .results .empty { padding: 12px 14px; color: var(--muted); }

  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 12px; font-size: 14px; min-height: 22px; }

  /* Bouton d'appel dans l'en-tête */
  .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .cta {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border: 0; border-radius: 9px;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--on-accent); background: var(--accent);
    cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.12);
  }
  .cta:hover { background: var(--accent-strong); }
  .cta svg, .dl svg, .export-head svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Carte d'export */
  .side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 12px; }
  .export {
    background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 16px;
    box-shadow: var(--shadow); scroll-margin-top: 12px;
  }
  .export.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 6px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .export-head { display: flex; align-items: center; gap: 8px; color: var(--accent); }
  .export-head h3 { margin: 0; font-size: 16px; color: var(--text); }
  .export-scope { margin: 10px 0 2px; font-size: 14px; color: var(--muted); }
  .export-scope b { color: var(--text); overflow-wrap: anywhere; }
  .export-hint { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
  .export-buttons { display: grid; gap: 8px; }
  .dl {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px; border: 0; border-radius: 9px;
    font: inherit; text-align: left; color: var(--on-accent); background: var(--accent); cursor: pointer;
    transition: background .15s, transform .15s;
  }
  .dl:hover:not(:disabled) { background: var(--accent-strong); transform: translateY(-1px); }
  .dl:focus-visible, .cta:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .dl:disabled { opacity: .6; cursor: progress; transform: none; }
  .dl span { display: flex; flex-direction: column; line-height: 1.25; }
  .dl b { font-size: 15px; }
  .dl small { font-size: 12px; opacity: .85; }
  .export-status { margin: 10px 0 0; font-size: 12px; color: var(--accent); font-weight: 600; overflow-wrap: anywhere; }
  .export-status:empty { display: none; }
  .crumbs button { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; }
  .crumbs button:hover { text-decoration: underline; }
  .crumbs .sep { color: var(--muted); }

  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 14px; align-items: start; padding-bottom: 32px; }
  .cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .col { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 200px; max-height: 70vh; }
  .col-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .col-head h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .col-head small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .col input { margin: 8px 8px 0; padding: 6px 9px; font: inherit; font-size: 13px; color: var(--text); background: var(--surface-2); border: 1px solid transparent; border-radius: 7px; outline: none; }
  .col input:focus { border-color: var(--accent); }
  .list { overflow: auto; padding: 6px; flex: 1; }
  .list button {
    display: flex; justify-content: space-between; gap: 6px; width: 100%; text-align: left;
    padding: 6px 8px; border: 0; border-radius: 6px; background: none; font: inherit; font-size: 14px;
    color: var(--text); cursor: pointer;
  }
  .list button:hover { background: var(--surface-2); }
  .list button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .list .tag { font-size: 11px; color: var(--muted); font-weight: 400; white-space: nowrap; }
  .placeholder { color: var(--muted); font-size: 13px; padding: 12px 8px; }

  .detail { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); }
  .detail .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 600; }
  .detail h2 { margin: 2px 0 12px; font-size: 20px; overflow-wrap: anywhere; }
  .detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; overflow-wrap: anywhere; }
  .detail dd button { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-align: left; }
  .detail dd button:hover { text-decoration: underline; }
  .detail .api { margin-top: 14px; font-size: 12px; }
  .detail .api a { color: var(--muted); }
  .error { background: #fde8eb; color: #8a1020; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; display: none; }
  .error.open { display: block; }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; order: -1; display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
    .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    .side { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .cols { grid-template-columns: 1fr; }
    .col { max-height: 50vh; }
  }
</style>
</head>
<body>
<div class="flag" aria-hidden="true"><span></span><span></span><span></span></div>
<header>
  <div class="top">
    <h1>Découpage territorial du Bénin</h1>
    <div class="top-actions">
      <a id="docs-link" href="/docs" hidden>Documentation de l'API →</a>
      <button type="button" class="cta" id="cta-export">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Télécharger les données
      </button>
    </div>
  </div>
  <p class="sub">Départements, communes, arrondissements et localités (villages et quartiers). <span class="source" id="source"></span></p>
  <div class="stats">
    <div class="stat"><b id="n-dep">–</b><span>départements</span></div>
    <div class="stat"><b id="n-com">–</b><span>communes</span></div>
    <div class="stat"><b id="n-arr">–</b><span>arrondissements</span></div>
    <div class="stat"><b id="n-loc">–</b><span>localités</span></div>
  </div>
</header>

<main>
  <div class="error" id="error"></div>
  <div class="search">
    <input id="q" type="search" placeholder="Rechercher une commune, un arrondissement ou une localité…" autocomplete="off" aria-label="Recherche">
    <div class="results" id="results"></div>
  </div>
  <nav class="crumbs" id="crumbs" aria-label="Fil d'Ariane"></nav>

  <div class="layout">
    <div class="cols">
      <section class="col" data-level="0"><div class="col-head"><h3>Départements</h3><small></small></div><input placeholder="Filtrer…" aria-label="Filtrer les départements"><div class="list"></div></section>
      <section class="col" data-level="1"><div class="col-head"><h3>Communes</h3><small></small></div><input placeholder="Filtrer…" aria-label="Filtrer les communes"><div class="list"></div></section>
      <section class="col" data-level="2"><div class="col-head"><h3>Arrondissements</h3><small></small></div><input placeholder="Filtrer…" aria-label="Filtrer les arrondissements"><div class="list"></div></section>
      <section class="col" data-level="3"><div class="col-head"><h3>Localités</h3><small></small></div><input placeholder="Filtrer…" aria-label="Filtrer les localités"><div class="list"></div></section>
    </div>
    <aside class="side">
      <div class="detail" id="detail"></div>
      <section class="export" id="export" aria-labelledby="export-title">
        <div class="export-head">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <h3 id="export-title">Télécharger les données</h3>
        </div>
        <p class="export-scope">Portée : <b id="export-scope">le Bénin entier</b></p>
        <p class="export-hint" id="export-hint"></p>
        <div class="export-buttons">
          <button type="button" class="dl" data-format="json">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            <span><b>JSON</b><small>Arborescence imbriquée</small></span>
          </button>
          <button type="button" class="dl" data-format="sql">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            <span><b>SQL</b><small>PostgreSQL · MySQL · SQLite</small></span>
          </button>
        </div>
        <p class="export-status" id="export-status" aria-live="polite"></p>
      </section>
    </aside>
  </div>
</main>

<script>
const API = '/api/v1';
const LEVELS = [
  { key: 'departement', label: 'Département', path: 'departements', placeholder: '' },
  { key: 'commune', label: 'Commune', path: 'communes', placeholder: 'Choisissez un département.' },
  { key: 'arrondissement', label: 'Arrondissement', path: 'arrondissements', placeholder: 'Choisissez une commune.' },
  { key: 'localite', label: 'Localité', path: 'localites', placeholder: 'Choisissez un arrondissement.' },
];
// Liste affichée et élément sélectionné, par niveau.
const state = { items: [[], [], [], []], selected: [null, null, null, null] };
const cols = [...document.querySelectorAll('.col')];
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString('fr-FR');
const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
const showError = (e) => { $('error').textContent = 'Erreur : ' + e.message; $('error').classList.add('open'); };

/* ------------------------------------------------------------------ *
 * Sources de données. Les deux exposent la même interface :
 *   totals()                 → [nDep, nCom, nArr, nLoc]
 *   children(level, parentId) → liste triée par nom (level 0 : départements)
 *   full(level, id)          → élément avec parents imbriqués et chefLieu
 *   homologue(id)            → département homologue ou null
 *   search(level, q)         → { data: [...8 max], total }
 *   ruesCount(id)            → nombre de rues de la localité, ou null
 *   apiUrl(level, id)        → URL de l'API, ou null
 * ------------------------------------------------------------------ */

// API NestJS (page servie par l'API).
function apiSource() {
  async function get(path) {
    const res = await fetch(API + '/' + path);
    if (!res.ok) throw new Error(`${res.status} sur /${path}`);
    return res.json();
  }
  const rows = (r) => (Array.isArray(r) ? r : r.data);
  return {
    label: 'API en direct',
    async totals() {
      const [d, ...rest] = await Promise.all([get('departements'), ...LEVELS.slice(1).map((l) => get(`${l.path}?limit=1`))]);
      return [d.length, ...rest.map((r) => r.total)];
    },
    async children(level, parentId) {
      if (level === 0) return rows(await get('departements'));
      return rows(await get(`${LEVELS[level - 1].path}/${parentId}/${LEVELS[level].path}?limit=500`));
    },
    full: (level, id) => get(`${LEVELS[level].path}/${id}`),
    homologue: (id) => get(`departements/${id}/homologue`).catch(() => null),
    search: (level, q) => get(`${LEVELS[level].path}?q=${encodeURIComponent(q)}&limit=8`),
    ruesCount: (id) => get(`localites/${id}/rues?limit=1`).then((r) => r.total, () => null),
    apiUrl: (level, id) => `${API}/${LEVELS[level].path}/${id}`,
    snapshot: () => get('export'),
  };
}

// Instantané JSON (GitHub Pages ou API indisponible) : data/decoupage.json.
function jsonSource(raw) {
  const tables = decode(raw);
  const byId = tables.map((t) => new Map(t.map((x) => [x.id, x])));
  const byNom = (a, b) => a.nom.localeCompare(b.nom, 'fr');
  const kids = tables.map((t, l) => {
    const m = new Map();
    if (l === 0) return m;
    for (const x of t) { const p = x[parentKey[l]]; if (!m.has(p)) m.set(p, []); m.get(p).push(x); }
    for (const list of m.values()) list.sort(byNom);
    return m;
  });
  const sorted = tables.map((t) => [...t].sort(byNom));
  const parentProp = [null, 'departement', 'commune', 'arrondissement'];
  // Élément avec ses parents imbriqués, comme le renvoie l'API.
  const withParents = (level, x) => {
    if (!x) return null;
    const out = { ...x };
    if (level > 0) out[parentProp[level]] = withParents(level - 1, byId[level - 1].get(x[parentKey[level]]));
    return out;
  };
  const date = new Date(raw.genereLe).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  return {
    label: `Instantané JSON du ${date}`,
    totals: async () => tables.map((t) => t.length),
    children: async (level, parentId) => (level === 0 ? sorted[0] : kids[level].get(parentId) || []),
    async full(level, id) {
      const x = withParents(level, byId[level].get(id));
      if (!x) throw new Error(`${LEVELS[level].label} ${id} introuvable`);
      if (level < 3 && x.chefLieuId) x.chefLieu = byId[level + 1].get(x.chefLieuId) || null;
      return x;
    },
    homologue: async (id) => {
      const d = byId[0].get(id);
      return tables[0].find((x) => x.groupe === d.groupe && x.id !== id) || null;
    },
    search: async (level, q) => {
      const f = norm(q);
      const hits = sorted[level].filter((x) => norm(x.nom).includes(f));
      return { data: hits.slice(0, 8), total: hits.length };
    },
    ruesCount: async () => null,
    apiUrl: () => null,
    snapshot: async () => raw,
  };
}

// Instantané compact { champs, lignes } → 4 tableaux d'objets (départements → localités).
const TABLE_NAMES = ['departements', 'communes', 'arrondissements', 'localites'];
const parentKey = [null, 'departementId', 'communeId', 'arrondissementId'];
function decode(raw) {
  return TABLE_NAMES.map((name) => {
    const { champs, lignes } = raw[name];
    return lignes.map((l) => Object.fromEntries(champs.map((c, i) => [c, l[i]])));
  });
}

// L'API d'abord ; à défaut (GitHub Pages), l'instantané JSON.
async function pickSource() {
  try {
    const res = await fetch(API + '/departements', { headers: { accept: 'application/json' } });
    if (res.ok && (res.headers.get('content-type') || '').includes('json')) return apiSource();
  } catch { /* pas d'API */ }
  const res = await fetch('data/decoupage.json');
  if (!res.ok) throw new Error('ni API ni data/decoupage.json disponibles');
  return jsonSource(await res.json());
}

let db;

/* ------------------------------------------------------------------ *
 * Export (JSON imbriqué ou script SQL) du Bénin entier ou de l'entité
 * sélectionnée avec toutes ses subdivisions. Les parents de l'entité
 * sont inclus pour garder une hiérarchie (et des clés étrangères) valide.
 * ------------------------------------------------------------------ */

// Lignes à exporter, par niveau, pour la portée { level, id } (null : tout).
function subset(tables, scope) {
  if (!scope) return tables;
  const keep = [new Set(), new Set(), new Set(), new Set()];
  // L'entité et ses descendants…
  keep[scope.level].add(scope.id);
  for (let l = scope.level + 1; l < 4; l++) {
    for (const x of tables[l]) if (keep[l - 1].has(x[parentKey[l]])) keep[l].add(x.id);
  }
  // …et ses ancêtres.
  let node = tables[scope.level].find((x) => x.id === scope.id);
  for (let l = scope.level; l > 0; l--) {
    const pid = node[parentKey[l]];
    keep[l - 1].add(pid);
    node = tables[l - 1].find((x) => x.id === pid);
  }
  return tables.map((t, l) => t.filter((x) => keep[l].has(x.id)));
}

function toNestedJson(t, meta) {
  const byNom = (a, b) => a.nom.localeCompare(b.nom, 'fr');
  const group = (rows, key) => {
    const m = new Map();
    for (const x of [...rows].sort(byNom)) { if (!m.has(x[key])) m.set(x[key], []); m.get(x[key]).push(x); }
    return m;
  };
  const [loc, arr, com] = [group(t[3], 'arrondissementId'), group(t[2], 'communeId'), group(t[1], 'departementId')];
  const departements = [...t[0]].sort(byNom).map((d) => ({
    id: d.id, code: d.code, nom: d.nom, groupe: d.groupe, chefLieuId: d.chefLieuId,
    communes: (com.get(d.id) || []).map((c) => ({
      id: c.id, code: c.code, nom: c.nom, statut: c.statut, chefLieuId: c.chefLieuId,
      arrondissements: (arr.get(c.id) || []).map((a) => ({
        id: a.id, code: a.code, nom: a.nom, chefLieuId: a.chefLieuId,
        localites: (loc.get(a.id) || []).map((x) => ({ id: x.id, nom: x.nom, type: x.type })),
      })),
    })),
  }));
  return JSON.stringify({ ...meta, departements }, null, 2);
}

function toSql(t, meta) {
  const v = (x) => (x === null || x === undefined ? 'NULL' : typeof x === 'number' ? String(x) : `'${String(x).replace(/'/g, "''")}'`);
  const insert = (table, cols, rows) => {
    const out = [];
    for (let i = 0; i < rows.length; i += 500) {
      const chunk = rows.slice(i, i + 500).map((r) => `  (${cols.map(([, k]) => v(r[k])).join(', ')})`);
      out.push(`INSERT INTO ${table} (${cols.map(([c]) => c).join(', ')}) VALUES\n${chunk.join(',\n')};`);
    }
    return out.join('\n\n');
  };
  const cols = {
    departement: [['id', 'id'], ['code', 'code'], ['nom', 'nom'], ['groupe', 'groupe'], ['chef_lieu_id', 'chefLieuId']],
    commune: [['id', 'id'], ['code', 'code'], ['nom', 'nom'], ['statut', 'statut'], ['departement_id', 'departementId'], ['chef_lieu_id', 'chefLieuId']],
    arrondissement: [['id', 'id'], ['code', 'code'], ['nom', 'nom'], ['commune_id', 'communeId'], ['chef_lieu_id', 'chefLieuId']],
    localite: [['id', 'id'], ['nom', 'nom'], ['type', 'type'], ['arrondissement_id', 'arrondissementId']],
  };
  return `-- Découpage territorial du Bénin
-- Portée : ${meta.portee}
-- Données du ${meta.donneesDu}, exporté le ${meta.exporteLe}
-- Totaux : ${t.map((x, l) => `${x.length} ${TABLE_NAMES[l]}`).join(', ')}
--
-- SQL standard : PostgreSQL, MySQL / MariaDB, SQLite.
-- chef_lieu_id (département → commune, commune → arrondissement,
-- arrondissement → localité) n'a pas de clé étrangère : la référence est
-- circulaire et le chef-lieu peut être hors de la portée exportée.

BEGIN;

CREATE TABLE IF NOT EXISTS departement (
  id INTEGER PRIMARY KEY,
  code VARCHAR(10),
  nom VARCHAR(100) NOT NULL,
  groupe VARCHAR(30),
  chef_lieu_id INTEGER
);

CREATE TABLE IF NOT EXISTS commune (
  id INTEGER PRIMARY KEY,
  code VARCHAR(20),
  nom VARCHAR(100) NOT NULL,
  statut VARCHAR(20),
  departement_id INTEGER NOT NULL,
  chef_lieu_id INTEGER,
  FOREIGN KEY (departement_id) REFERENCES departement (id)
);

CREATE TABLE IF NOT EXISTS arrondissement (
  id INTEGER PRIMARY KEY,
  code VARCHAR(20),
  nom VARCHAR(150) NOT NULL,
  commune_id INTEGER NOT NULL,
  chef_lieu_id INTEGER,
  FOREIGN KEY (commune_id) REFERENCES commune (id)
);

CREATE TABLE IF NOT EXISTS localite (
  id INTEGER PRIMARY KEY,
  nom VARCHAR(150) NOT NULL,
  type VARCHAR(20),
  arrondissement_id INTEGER NOT NULL,
  FOREIGN KEY (arrondissement_id) REFERENCES arrondissement (id)
);

${Object.entries(cols).map(([table, c], l) => insert(table, c, t[l])).filter(Boolean).join('\n\n')}

COMMIT;
`;
}

const slug = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function currentScope() {
  for (let l = 3; l >= 0; l--) if (state.selected[l]) return { level: l, id: state.selected[l].id, item: state.selected[l] };
  return null;
}

function renderExportScope() {
  const s = currentScope();
  $('export-scope').textContent = s ? `${s.item.nom} (${LEVELS[s.level].label.toLowerCase()})` : 'le Bénin entier';
  $('export-hint').textContent = s
    ? (s.level < 3 ? `Avec toutes ses subdivisions et ses parents. ` : 'Avec ses parents. ') + 'Cliquez sur « Bénin » dans le fil d’Ariane pour tout exporter.'
    : 'Sélectionnez une entité pour n’exporter qu’elle et ses subdivisions.';
}

async function exportData(format) {
  const status = $('export-status');
  const buttons = document.querySelectorAll('.dl');
  buttons.forEach((b) => (b.disabled = true));
  status.textContent = 'Préparation…';
  try {
    const raw = await db.snapshot();
    const scope = currentScope();
    const t = subset(decode(raw), scope);
    const portee = scope ? `${LEVELS[scope.level].label} ${scope.item.nom} (id ${scope.id}) et ses subdivisions` : 'Bénin entier';
    const today = new Date().toISOString().slice(0, 10);
    const meta = {
      source: 'bj-decoupage-territorial',
      portee,
      donneesDu: raw.genereLe.slice(0, 10),
      exporteLe: today,
      totaux: Object.fromEntries(TABLE_NAMES.map((n, l) => [n, t[l].length])),
    };
    const body = format === 'sql' ? toSql(t, meta) : toNestedJson(t, meta);
    const name = `decoupage-benin${scope ? '-' + slug(scope.item.nom) : ''}-${today}.${format}`;
    const type = format === 'sql' ? 'application/sql' : 'application/json';
    const url = URL.createObjectURL(new Blob([body], { type: type + ';charset=utf-8' }));
    const a = el('a', { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    const kb = Math.max(1, Math.round(body.length / 1024));
    status.textContent = `✓ ${name} téléchargé (${fmt(kb)} Ko)`;
  } catch (e) {
    status.textContent = '';
    showError(e);
  } finally {
    buttons.forEach((b) => (b.disabled = false));
  }
}
document.querySelectorAll('.dl').forEach((b) => b.addEventListener('click', () => exportData(b.dataset.format)));
// Bouton de l'en-tête : amène à la carte d'export et la fait ressortir.
$('cta-export').addEventListener('click', () => {
  const card = $('export');
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  card.classList.remove('flash');
  void card.offsetWidth; // relance l'animation
  card.classList.add('flash');
  card.querySelector('.dl').focus({ preventScroll: true });
});

/* ------------------------------------------------------------------ *
 * Interface
 * ------------------------------------------------------------------ */

function tagFor(level, item) {
  if (level === 0) return item.code || '';
  if (level === 1 && item.statut === 'PARTICULIER') return 'particulier';
  if (level === 3 && item.type) return item.type.toLowerCase();
  return '';
}

function renderCol(level) {
  const col = cols[level];
  const f = norm(col.querySelector('input').value.trim());
  const items = state.items[level];
  const list = col.querySelector('.list');
  col.querySelector('small').textContent = items.length ? fmt(items.length) : '';
  list.replaceChildren();
  if (!items.length) {
    const msg = level > 0 && !state.selected[level - 1] ? LEVELS[level].placeholder : 'Aucune donnée.';
    list.append(el('div', { className: 'placeholder', textContent: msg }));
    return;
  }
  for (const item of items) {
    if (f && !norm(item.nom).includes(f)) continue;
    const btn = el('button', { type: 'button' }, el('span', { textContent: item.nom }), el('span', { className: 'tag', textContent: tagFor(level, item) }));
    if (state.selected[level]?.id === item.id) btn.classList.add('on');
    btn.addEventListener('click', () => select(level, item.id));
    list.append(btn);
  }
}

// Sélectionne l'élément `id` au niveau `level`, vide les niveaux inférieurs et charge le suivant.
async function select(level, id, { updateHash = true } = {}) {
  const item = state.items[level].find((x) => x.id === id);
  if (!item) return;
  state.selected[level] = item;
  for (let l = level + 1; l < 4; l++) { state.selected[l] = null; state.items[l] = []; cols[l].querySelector('input').value = ''; }
  for (let l = level; l < 4; l++) renderCol(l);
  renderCrumbs();
  if (updateHash) history.replaceState(null, '', `#/${LEVELS[level].key}/${id}`);
  if (level < 3) {
    try { state.items[level + 1] = await db.children(level + 1, id); } catch (e) { showError(e); }
    if (state.selected[level]?.id !== id) return; // sélection changée entre-temps
    renderCol(level + 1);
  }
  renderDetail(level, item);
}

function renderCrumbs() {
  renderExportScope();
  $('export-status').textContent = '';
  const c = $('crumbs');
  c.replaceChildren();
  const root = el('button', { type: 'button', textContent: 'Bénin' });
  root.addEventListener('click', reset);
  c.append(root);
  state.selected.forEach((s, l) => {
    if (!s) return;
    c.append(el('span', { className: 'sep', textContent: '›' }));
    const b = el('button', { type: 'button', textContent: s.nom });
    b.addEventListener('click', () => select(l, s.id));
    c.append(b);
  });
}

function link(text, onClick) {
  const b = el('button', { type: 'button', textContent: text });
  b.addEventListener('click', onClick);
  return b;
}

let detailSeq = 0;
async function renderDetail(level, item) {
  const seq = ++detailSeq;
  const stale = () => seq !== detailSeq; // un autre détail a été demandé entre-temps
  const d = $('detail');
  const L = LEVELS[level];
  const dl = el('dl');
  const row = (k, v) => { if (v === null || v === undefined || v === '') return; dl.append(el('dt', { textContent: k }), el('dd', {}, v)); };
  d.replaceChildren(el('div', { className: 'kind', textContent: L.label }), el('h2', { textContent: item.nom }), dl);
  row('Identifiant', String(item.id));
  row('Code', item.code);

  try {
    const full = await db.full(level, item.id);
    if (stale()) return;
    if (level === 0) {
      row('Groupe', full.groupe);
      const h = await db.homologue(item.id);
      if (stale()) return;
      if (h) row('Homologue', link(h.nom, () => navigate('departement', h.id)));
      if (full.chefLieu) row('Chef-lieu', link(full.chefLieu.nom, () => navigate('commune', full.chefLieu.id)));
    }
    if (level === 1) {
      row('Statut', full.statut === 'PARTICULIER' ? 'Particulier' : 'Ordinaire');
      if (full.chefLieu) row('Chef-lieu', link(full.chefLieu.nom, () => navigate('arrondissement', full.chefLieu.id)));
    }
    if (level === 2 && full.chefLieu) row('Chef-lieu', link(full.chefLieu.nom, () => navigate('localite', full.chefLieu.id)));
    if (level === 3) row('Type', full.type ? full.type.toLowerCase() : 'non renseigné');
    if (level < 3) row(LEVELS[level + 1].label + 's', fmt(state.items[level + 1].length));
    if (level === 3) {
      const n = await db.ruesCount(item.id);
      if (stale()) return;
      if (n !== null) row('Rues', fmt(n));
    }
  } catch (e) { if (stale()) return; showError(e); }

  const api = db.apiUrl(level, item.id);
  if (api) d.append(el('div', { className: 'api' }, el('a', { href: api, target: '_blank', rel: 'noopener', textContent: 'GET ' + api })));
}

function renderEmptyDetail() {
  detailSeq++;
  $('detail').replaceChildren(
    el('div', { className: 'kind', textContent: 'République du Bénin' }),
    el('h2', { textContent: 'Sélectionnez une entité' }),
    el('p', { className: 'placeholder', style: 'padding:0', textContent: 'Parcourez la hiérarchie colonne par colonne, ou utilisez la recherche pour aller directement à une commune, un arrondissement ou une localité.' }),
  );
}

function reset() {
  for (let l = 0; l < 4; l++) { state.selected[l] = null; if (l) state.items[l] = []; cols[l].querySelector('input').value = ''; }
  for (let l = 0; l < 4; l++) renderCol(l);
  renderCrumbs();
  renderEmptyDetail();
  history.replaceState(null, '', location.pathname + location.search);
}

// Va directement à une entité : on remonte sa hiérarchie puis on sélectionne chaque niveau.
async function navigate(kind, id) {
  try {
    const level = LEVELS.findIndex((l) => l.key === kind);
    if (level < 0) return;
    const full = await db.full(level, id);
    const chain = [];
    let node = full;
    for (let l = level; l >= 0; l--) {
      chain[l] = node.id;
      node = l === 3 ? node.arrondissement : l === 2 ? node.commune : l === 1 ? node.departement : null;
    }
    for (let l = 0; l <= level; l++) {
      if (l > 0 && !state.items[l].some((x) => x.id === chain[l])) {
        state.items[l] = await db.children(l, chain[l - 1]);
      }
      await select(l, chain[l], { updateHash: l === level });
    }
    cols[level].querySelector('.on')?.scrollIntoView({ block: 'nearest' });
  } catch (e) { showError(e); }
}

// Recherche globale.
let searchTimer, searchSeq = 0;
$('q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 220);
});
$('q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('results').classList.remove('open'); e.target.blur(); } });
document.addEventListener('click', (e) => { if (!e.target.closest('.search')) $('results').classList.remove('open'); });
$('q').addEventListener('focus', () => { if ($('results').childElementCount) $('results').classList.add('open'); });

async function runSearch() {
  const q = $('q').value.trim();
  const box = $('results');
  if (q.length < 2 || !db) { box.classList.remove('open'); box.replaceChildren(); return; }
  const seq = ++searchSeq;
  try {
    const levels = [1, 2, 3];
    const res = await Promise.all(levels.map((l) => db.search(l, q)));
    if (seq !== searchSeq) return;
    box.replaceChildren();
    res.forEach((r, i) => {
      if (!r.data.length) return;
      const L = LEVELS[levels[i]];
      box.append(el('h4', { textContent: `${L.label}s (${fmt(r.total)})` }));
      for (const item of r.data) {
        const b = el('button', { type: 'button', textContent: item.nom });
        b.addEventListener('click', () => {
          box.classList.remove('open');
          navigate(L.key, item.id);
        });
        box.append(b);
      }
    });
    if (!box.childElementCount) box.append(el('div', { className: 'empty', textContent: 'Aucun résultat.' }));
    box.classList.add('open');
  } catch (e) { showError(e); }
}

cols.forEach((col, l) => col.querySelector('input').addEventListener('input', () => renderCol(l)));

// Liens directs : #/departement/3, #/commune/16, #/arrondissement/1, #/localite/1
function fromHash() {
  const m = location.hash.match(/^#\/(\w+)\/(\d+)$/);
  if (m && db) navigate(m[1], Number(m[2]));
}
window.addEventListener('hashchange', fromHash);

async function init() {
  renderEmptyDetail();
  renderCrumbs();
  try {
    db = await pickSource();
    $('source').textContent = db.label;
    $('docs-link').hidden = !db.apiUrl(0, 1);
    state.items[0] = await db.children(0);
    for (let l = 0; l < 4; l++) renderCol(l);
    const [d, c, a, lo] = await db.totals();
    $('n-dep').textContent = fmt(d);
    $('n-com').textContent = fmt(c);
    $('n-arr').textContent = fmt(a);
    $('n-loc').textContent = fmt(lo);
    fromHash();
  } catch (e) { showError(e); }
}
init();
</script>
